<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>색면화 프리비즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 좌측 조작 패널 + 우측 화면(위: 공간, 아래: 펼친 출력 화면). 좁은 화면에서는 화면 위, 패널 아래. */
:root {
  --bg: #0d0f10; --panel: #15181a; --fg: #e6eaec; --muted: #8f999f; --line: #2a3135;
  --field: #1c2124; --accent: #4cc2e4; --accent-ink: #062431;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: dark; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 13px; overflow: hidden; }
#app { display: grid; grid-template-columns: 330px 1fr; height: 100%; }
aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 14px 16px 28px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
aside header h1 { font-size: 15px; margin: 0; font-weight: 700; }
aside header p { margin: 4px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
aside header a { color: var(--accent); }
.sec h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
.btns { display: flex; flex-wrap: wrap; gap: 5px; }
.b { border: 1px solid var(--line); background: var(--field); color: var(--fg); border-radius: 6px; padding: 5px 9px; font: 500 12px var(--sans); cursor: pointer; }
.b:hover { border-color: var(--accent); }
.b.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.b:disabled { opacity: .45; cursor: default; border-color: var(--line); }
.b:focus-visible, .thumbs button:focus-visible, input:focus-visible, summary:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.thumbs button { padding: 0; border: 1px solid var(--line); border-radius: 5px; background: var(--field); cursor: pointer; aspect-ratio: 1; overflow: hidden; }
.thumbs button img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumbs button.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.thumbs .up { display: grid; place-items: center; color: var(--muted); font-size: 11px; line-height: 1.3; text-align: center; }
details.grp { border-top: 1px solid var(--line); padding-top: 8px; }
details.grp summary { cursor: pointer; font-size: 12.5px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; align-items: center; padding: 2px 0 6px; }
details.grp summary::-webkit-details-marker { display: none; }
details.grp summary::after { content: '+'; color: var(--muted); font: 14px var(--mono); }
details.grp[open] summary::after { content: '−'; }
details.grp summary .rs { margin-left: auto; margin-right: 10px; font: 500 11px var(--sans); color: var(--muted); background: none; border: 0; cursor: pointer; padding: 0; }
details.grp summary .rs:hover { color: var(--accent); }
.ctl { margin-bottom: 7px; }
.ctl .lab { display: flex; justify-content: space-between; color: var(--muted); font-size: 11.5px; margin-bottom: 2px; }
.ctl .lab output { font: 11px var(--mono); color: var(--fg); }
.ctl input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }
.ctl .btns .b { padding: 4px 8px; font-size: 11.5px; }
.ctl.dim { opacity: .45; }
.hint { color: var(--muted); font-size: 11.5px; line-height: 1.6; margin: 0; }
.state { font-size: 12px; line-height: 1.5; min-height: 46px; }
.state small { display: block; color: var(--muted); font: 11px var(--mono); }
.chips { float: right; display: flex; flex-direction: column; width: 40px; height: 40px; margin-left: 8px; border-radius: 3px; overflow: hidden; border: 1px solid var(--line); }
textarea#json { width: 100%; box-sizing: border-box; min-height: 70px; background: var(--field); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; font: 10.5px/1.4 var(--mono); padding: 6px; resize: vertical; }
main { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #000; }
main canvas { display: block; }
#cap { position: absolute; left: 0; right: 0; pointer-events: none; }
#cap .corner { position: absolute; top: 0; bottom: 0; border-left: 1px dashed rgba(255,255,255,.35); }
#cap .t { position: absolute; top: 6px; font: 10.5px var(--mono); color: rgba(255,255,255,.6); padding: 0 8px; text-shadow: 0 1px 2px #000; }
#cap .l { left: 0; } #cap .r { right: 0; }
#cap .rule { position: absolute; left: 0; right: 0; top: 0; border-top: 1px solid #2a3135; }
#vlabel { position: absolute; left: 12px; top: 10px; font: 10.5px var(--mono); color: rgba(255,255,255,.55); pointer-events: none; }
#fps { position: absolute; right: 12px; top: 10px; font: 10.5px var(--mono); color: rgba(255,255,255,.4); pointer-events: none; }
@media (max-width: 760px) {
  #app { grid-template-columns: 1fr; grid-template-rows: 52% 48%; }
  main { grid-row: 1; }
  aside { grid-row: 2; border-right: 0; border-top: 1px solid var(--line); }
  .thumbs { grid-template-columns: repeat(8, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div id="app">
  <aside>
    <header>
      <h1>색면화 · 좌대 연동 미디어아트</h1>
      <p>갤러리808 색면화 방 프리비즈. 정면 벽(7.4 m)과 오른쪽 벽(5.4 m)을 이어 한 화면으로 투사. <a href="../">전체 설치 시뮬레이션 ↗</a></p>
    </header>
    <div class="sec">
      <h2>좌대에 그림 올리기</h2>
      <div class="thumbs" id="thumbs"></div>
      <input type="file" id="file" accept="image/*" hidden>
      <div class="btns" style="margin-top:8px">
        <button class="b" id="off">그림 빼기</button>
        <button class="b" id="sound">소리 켜기</button>
        <button class="b" id="replay">다시 흘러나오기</button>
      </div>
      <div class="state" id="state" style="margin-top:10px"></div>
    </div>
    <div class="sec">
      <h2>보기</h2>
      <div class="btns" id="mode">
        <button class="b" data-v="both">공간 + 펼친 화면</button>
        <button class="b" data-v="room">공간만</button>
        <button class="b" data-v="flat">펼친 화면만</button>
      </div>
      <div class="btns" id="views" style="margin-top:5px"></div>
      <div class="btns" id="dir" style="margin-top:5px">
        <button class="b" data-v="ltr">왼쪽 벽 쪽에서 시작</button>
        <button class="b" data-v="rtl">반대로</button>
      </div>
    </div>
    <div class="sec">
      <h2>조절</h2>
      <div class="btns" id="presets"></div>
      <p class="hint" style="margin-top:6px">값을 바꾸면 지금 벽에 있는 그림에 바로 반영돼요. 나타나는 방식·순서·속도는 「다시 흘러나오기」로 처음부터 볼 수 있어요. 바꾼 값은 이 브라우저에 저장돼요.</p>
    </div>
    <div id="groups"></div>
    <details class="grp">
      <summary>설정 내보내기 · 불러오기</summary>
      <textarea id="json" spellcheck="false" aria-label="설정 JSON"></textarea>
      <div class="btns" style="margin-top:6px"><button class="b" id="j-copy">복사</button><button class="b" id="j-load">붙여넣은 값 불러오기</button></div>
      <p class="hint" id="j-msg" style="margin-top:6px">마음에 드는 조합을 복사해 두거나 다른 컴퓨터에 붙여 넣어 같은 화면을 볼 수 있어요.</p>
    </details>
  </aside>
  <main id="main">
    <div id="vlabel"></div>
    <div id="fps"></div>
    <div id="cap" hidden><div class="rule"></div><div class="corner" id="corner"></div><span class="t l" id="capL"></span><span class="t r" id="capR"></span></div>
  </main>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const $ = s => document.querySelector(s);

/* ───────── 조절 항목 ─────────
   seg = 고르기(값은 순번), 나머지는 슬라이더. u = 셰이더 uniform 이름(u + 키)으로 바로 넘김 */
const GROUPS = [
  ['appear', '나타나는 방식', true, [
    { k: 'entry', l: '알갱이가 오는 곳', seg: ['왼쪽에서 쏘기', '흩어진 데서 모이기', '위에서 떨어지기', '아래서 떠오르기', '띠 중심선에서 펼쳐지기'], d: 0, u: 1 },
    { k: 'order', l: '채워지는 순서', seg: ['왼쪽 → 오른쪽', '오른쪽 → 왼쪽', '가운데부터', '양 끝부터', '무작위', '한꺼번에'], d: 0, u: 1 },
    { k: 'bandOrder', l: '띠 순서', seg: ['위 띠부터', '아래 띠부터', '두꺼운 띠부터', '얇은 띠부터', '모든 띠 함께'], d: 0 },
    { k: 'gap', l: '띠 사이 간격', min: 0, max: 6, step: 0.1, d: 2.2, f: v => v.toFixed(1) + ' 초', u: 1 },
    { k: 'travel', l: '한 띠가 다 채워지는 시간', min: 1, max: 40, step: 0.5, d: 12, f: v => v.toFixed(1) + ' 초', u: 1 },
    { k: 'fly', l: '알갱이 비행 시간', min: 0.2, max: 10, step: 0.1, d: 3.5, f: v => v.toFixed(1) + ' 초', u: 1 },
    { k: 'jit', l: '도착 시각 흩어짐', min: 0, max: 6, step: 0.1, d: 1.2, f: v => v.toFixed(1) + ' 초', u: 1 },
    { k: 'spread', l: '출발 위치 퍼짐', min: 0, max: 4, step: 0.05, d: 1, f: v => v.toFixed(2) + '×', u: 1 },
    { k: 'flyGlow', l: '날아갈 때 밝기', min: 0, max: 3, step: 0.05, d: 0.3, f: v => '+' + v.toFixed(2), u: 1 },
  ]],
  ['hold', '머무는 동안', true, [
    { k: 'hold', l: '움직임', seg: ['제자리에서 흔들림', '오른쪽으로 흐름', '숨 쉬기', '출렁임'], d: 0, u: 1 },
    { k: 'drift', l: '흐르는 속도 (흐름일 때)', min: -150, max: 150, step: 1, d: 18, f: v => v.toFixed(0) + ' px/초', u: 1, when: o => o.hold === 1 },
    { k: 'breath', l: '숨·출렁임 주기', min: 2, max: 40, step: 0.5, d: 10, f: v => v.toFixed(1) + ' 초', u: 1, when: o => o.hold >= 2 },
    { k: 'turb', l: '흔들림 세기', min: 0, max: 5, step: 0.05, d: 1, f: v => v.toFixed(2) + '×', u: 1 },
    { k: 'flow', l: '흔들림 속도', min: 0, max: 4, step: 0.05, d: 1, f: v => v.toFixed(2) + '×', u: 1 },
    { k: 'noise', l: '소용돌이 촘촘함', min: 0.1, max: 5, step: 0.05, d: 1, f: v => v.toFixed(2) + '×', u: 1 },
    { k: 'twAmt', l: '반짝임 세기', min: 0, max: 5, step: 0.05, d: 1, f: v => v.toFixed(2) + '×', u: 1 },
    { k: 'twSpd', l: '반짝임 속도', min: 0, max: 6, step: 0.05, d: 1, f: v => v.toFixed(2) + '×', u: 1 },
    { k: 'waveAmp', l: '빛 물결 세기', min: 0, max: 4, step: 0.05, d: 1, f: v => v.toFixed(2) + '×', u: 1 },
    { k: 'wavePer', l: '빛 물결 주기', min: 3, max: 60, step: 0.5, d: 18, f: v => v.toFixed(1) + ' 초', u: 1 },
  ]],
  ['leave', '사라지는 방식 (그림을 바꾸거나 뺄 때)', false, [
    { k: 'exit', l: '움직임', seg: ['바람에 날림', '아래로 떨어짐', '제자리에서 사라짐', '위로 흩어짐', '소용돌이'], d: 0, u: 1 },
    { k: 'leave', l: '왼쪽부터 다 빠질 때까지', min: 0, max: 15, step: 0.1, d: 4.5, f: v => v.toFixed(1) + ' 초', u: 1 },
    { k: 'exitSpd', l: '빠지는 속도', min: 0.1, max: 4, step: 0.05, d: 1, f: v => v.toFixed(2) + '×', u: 1 },
    { k: 'delay', l: '다음 그림이 나오기까지', min: 0, max: 10, step: 0.1, d: 2.5, f: v => v.toFixed(1) + ' 초' },
  ]],
  ['shape', '알갱이 형태', true, [
    { k: 'shape', l: '모양', seg: ['둥근 빛', '또렷한 점', '네모', '가로 획', '별', '고리'], d: 0, u: 1 },
    { k: 'count', l: '알갱이 수 (그림 하나)', min: 20000, max: 200000, step: 10000, d: 140000, f: v => (v / 10000).toFixed(0) + '만 개' },
    { k: 'size', l: '크기', min: 0.5, max: 16, step: 0.25, d: 4, f: v => v.toFixed(2) + ' px', u: 1 },
    { k: 'sizeVar', l: '크기 편차', min: 0, max: 2, step: 0.05, d: 0.9, f: v => v.toFixed(2), u: 1 },
    { k: 'bandScale', l: '띠 두께', min: 0.1, max: 1.3, step: 0.01, d: 1, f: v => Math.round(v * 100) + '%', u: 1 },
    { k: 'feather', l: '띠 경계 번짐', min: 0, max: 80, step: 1, d: 0, f: v => v.toFixed(0) + ' px', u: 1 },
  ]],
  ['light', '색 · 빛', false, [
    { k: 'gain', l: '밝기', min: 0.05, max: 3, step: 0.05, d: 0.75, f: v => v.toFixed(2), u: 1 },
    { k: 'sat', l: '채도', min: 0, max: 2, step: 0.05, d: 1, f: v => Math.round(v * 100) + '%', u: 1 },
    { k: 'bloom', l: '번짐(블룸) 세기', min: 0, max: 2.5, step: 0.05, d: 0.4, f: v => v.toFixed(2) },
    { k: 'bloomR', l: '번짐 반경', min: 0, max: 1, step: 0.02, d: 0.5, f: v => v.toFixed(2) },
    { k: 'bloomT', l: '번짐 시작 밝기', min: 0, max: 1, step: 0.02, d: 0.3, f: v => v.toFixed(2) },
  ]],
  ['idle', '아이들 (그림이 없을 때)', false, [
    { k: 'iGain', l: '밝기', min: 0, max: 4, step: 0.05, d: 1, f: v => v.toFixed(2) + '×', u: 1 },
    { k: 'iSpd', l: '떠도는 속도', min: 0, max: 6, step: 0.05, d: 1, f: v => v.toFixed(2) + '×', u: 1 },
    { k: 'iBreath', l: '숨 주기', min: 2, max: 40, step: 0.5, d: 10, f: v => v.toFixed(1) + ' 초', u: 1 },
  ]],
  ['sound', '소리', false, [
    { k: 'vol', l: '음량', min: 0, max: 1.5, step: 0.05, d: 0.9, f: v => Math.round(v * 100) + '%' },
    { k: 'verb', l: '잔향', min: 0, max: 1.5, step: 0.05, d: 0.5, f: v => Math.round(v * 100) + '%' },
    { k: 'bell', l: '띠가 출발할 때 종소리', min: 0, max: 2, step: 0.05, d: 1, f: v => Math.round(v * 100) + '%' },
    { k: 'bellLen', l: '종소리 여운', min: 1, max: 15, step: 0.5, d: 7, f: v => v.toFixed(1) + ' 초' },
    { k: 'pad', l: '머무는 소리', min: 0, max: 2, step: 0.05, d: 1, f: v => Math.round(v * 100) + '%' },
    { k: 'padIn', l: '머무는 소리가 차오르는 시간', min: 0.2, max: 20, step: 0.2, d: 6, f: v => v.toFixed(1) + ' 초' },
  ]],
];
const PARAMS = GROUPS.flatMap(g => g[3]);
const DEF = Object.fromEntries(PARAMS.map(p => [p.k, p.d]));
const PRESETS = [
  ['차분하게 (기본)', {}],
  ['빛 먼지', { count: 200000, size: 2.25, sizeVar: 1.2, twAmt: 2.6, twSpd: 0.6, turb: 0.6, gain: 0.6, bloom: 0.7, entry: 1, spread: 1.4, fly: 5 }],
  ['흐르는 강', { hold: 1, drift: 22, shape: 3, size: 7, sizeVar: 1.4, turb: 0.5, twAmt: 0.6, entry: 0, fly: 2.5, gain: 0.7, exit: 0 }],
  ['모여드는 색', { entry: 1, order: 2, spread: 2.2, fly: 6, hold: 2, breath: 12, shape: 1, size: 3, gain: 0.7, exit: 2, leave: 6 }],
  ['떨어지는 빛', { entry: 2, order: 4, fly: 4.5, jit: 3, spread: 1.5, shape: 4, size: 6, count: 90000, gain: 1.1, exit: 1, twAmt: 1.8 }],
  ['출렁이는 띠', { hold: 3, breath: 14, turb: 1.4, feather: 14, bandScale: 0.85, size: 3.5, entry: 4, order: 5, bandOrder: 4, fly: 5 }],
];
const STORE = 'cf-prefs-v2';
const pref = (() => { try { return JSON.parse(localStorage.getItem(STORE) || '{}'); } catch (e) { return {}; } })();
const opt = Object.assign({ mode: 'both', dir: 'ltr' }, DEF, pref);
const savePrefs = () => { try { localStorage.setItem(STORE, JSON.stringify(opt)); } catch (e) { } };

/* ───────── 방 치수 (전체 시뮬레이션의 배치도 환산값) ─────────
   원점 = 왼쪽 벽(서) · 방 입구 쪽(북) 모서리. X = 동, Z = 남. 정면 벽 = 남쪽, 오른쪽 벽 = 동쪽 */
const ROOM = { W: 7.4, D: 7.1, H: 3.6, RL: 5.45, ped: [3.73, 3.66], pedW: 0.6, pedH: 0.9 };
const TOTAL = ROOM.W + ROOM.RL;
// 펼친 화면 크기, 첫 띠가 출발하기까지, 내보낸 그림을 지우기까지(초), 입자 최대 수
const CF = { PW: 2048, PH: 576, L0: 1.0, XF: 40, NMAX: 200000, NI: 50000 };

/* ───────── 렌더러 ───────── */
const main = $('#main');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.autoClear = false;
main.prepend(renderer.domElement);

/* ───────── 입자 장면 (펼친 화면 2048×576, 위가 벽 위) ───────── */
const pScene = new THREE.Scene();
const pCam = new THREE.OrthographicCamera(0, CF.PW, CF.PH, 0, -1, 1);
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(CF.PW, CF.PH, { type: THREE.HalfFloatType }));
composer.renderToScreen = false;
composer.setPixelRatio(1);

  const w = $('#' + id), paint = () => w.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === opt[key]));
  w.querySelectorAll('button').forEach(b => b.onclick = () => { opt[key] = b.dataset.v; paint(); savePrefs(); after(); });
  paint();
}
seg('mode', 'mode', resize);
seg('dir', 'dir', applyDir);

// 조절값 하나를 화면·소리에 반영
function apply(k) {
  const v = opt[k];
  if (SU[uName(k)]) SU[uName(k)].value = v;
  if (k === 'count') slots.forEach(s => s.pts.geometry.setDrawRange(0, v));
  if (k === 'bloom') bloom.strength = v;
  if (k === 'bloomR') bloom.radius = v;
  if (k === 'bloomT') bloom.threshold = v;
  if (k === 'bandOrder') slots.forEach(s => s.show && applyRanks(s.show));
  if (snd.ctx) {
    const t = snd.ctx.currentTime;
    if (k === 'vol' && snd.on) snd.master.gain.setTargetAtTime(v, t, 0.1);
    if (k === 'verb') snd.wet.gain.setTargetAtTime(v, t, 0.1);
  }
}
const ctlEls = {};
function paintCtl(p) {
  const el = ctlEls[p.k]; if (!el) return;
  if (p.seg) el.querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i === opt[p.k]));
  else { el.querySelector('input').value = opt[p.k]; el.querySelector('output').textContent = p.f(opt[p.k]); }
}
function paintWhen() { PARAMS.forEach(p => { if (p.when) ctlEls[p.k].classList.toggle('dim', !p.when(opt)); }); }
function setOpt(k, v) { opt[k] = v; apply(k); paintCtl(PARAMS.find(p => p.k === k)); paintWhen(); savePrefs(); renderJSON(); }
GROUPS.forEach(([id, title, open, items]) => {
  const d = document.createElement('details'); d.className = 'grp'; d.open = open;
  d.innerHTML = `<summary>${title}<button class="rs" type="button">기본값</button></summary>`;
  d.querySelector('.rs').onclick = e => { e.preventDefault(); e.stopPropagation(); items.forEach(p => setOpt(p.k, p.d)); };
  items.forEach(p => {
    const c = document.createElement('div'); c.className = 'ctl'; ctlEls[p.k] = c;
    if (p.seg) {
      c.innerHTML = `<div class="lab">${p.l}</div><div class="btns">${p.seg.map((s, i) => `<button class="b" type="button" data-i="${i}">${s}</button>`).join('')}</div>`;
      c.querySelectorAll('button').forEach(b => b.onclick = () => setOpt(p.k, +b.dataset.i));
    } else {
      const id = 'p-' + p.k;
      c.innerHTML = `<div class="lab"><label for="${id}">${p.l}</label><output></output></div><input type="range" id="${id}" min="${p.min}" max="${p.max}" step="${p.step}">`;
      c.querySelector('input').oninput = e => setOpt(p.k, +e.target.value);
    }
    d.appendChild(c); paintCtl(p);
  });
  $('#groups').appendChild(d);
});
PRESETS.forEach(([name, vals]) => {
  const b = document.createElement('button'); b.className = 'b'; b.type = 'button'; b.textContent = name;
  b.onclick = () => { GROUPS.filter(g => g[0] !== 'sound').flatMap(g => g[3]).forEach(p => setOpt(p.k, vals[p.k] ?? p.d)); replay(); }; // 소리 설정은 그대로 둠
  $('#presets').appendChild(b);
});
PARAMS.forEach(p => apply(p.k)); paintWhen();
function renderJSON() { const o = {}; PARAMS.forEach(p => o[p.k] = opt[p.k]); $('#json').value = JSON.stringify(o); }
$('#j-copy').onclick = async () => { const ta = $('#json'); try { await navigator.clipboard.writeText(ta.value); $('#j-msg').textContent = '복사했어요.'; } catch (e) { ta.select(); $('#j-msg').textContent = '자동 복사가 막혀 있어요. 선택된 글자를 ⌘C로 복사하세요.'; } };
$('#j-load').onclick = () => {
  try {
    const o = JSON.parse($('#json').value); let n = 0;
    PARAMS.forEach(p => { if (typeof o[p.k] === 'number') { setOpt(p.k, p.seg ? Math.max(0, Math.min(p.seg.length - 1, Math.round(o[p.k]))) : Math.max(p.min, Math.min(p.max, o[p.k]))); n++; } });
    $('#j-msg').textContent = `${n}개 값을 불러왔어요.`; replay();
  } catch (e) { $('#j-msg').textContent = '불러오지 못했어요: JSON 형식을 확인하세요.'; }
};
renderJSON();
function renderUI() {
  document.querySelectorAll('#thumbs button[data-k]').forEach(b => b.classList.toggle('on', b.dataset.k === field.cur?.key));
  $('#off').disabled = $('#replay').disabled = !field.cur;
  renderState();
}
function renderState() {
  const s = field.cur, el = $('#state');
  if (!s) { el.innerHTML = `<b>아이들</b> · 올렸던 그림 ${field.hist.length}점의 알갱이가 떠돌고 있어요<small>${opt.iBreath}초 주기로 숨 쉼 · ${snd.on ? '소리 켜짐' : '소리 꺼짐'}</small>`; return; }
  const tau = phaseOf(s, tnow()), lastL = CF.L0 + Math.max(...s.rank) * opt.gap;
  const stage = tau < 0 ? '준비' : tau < lastL + opt.travel + opt.jit + 1 ? '흘러나오는 중' : '머무는 중 (다음 그림을 올릴 때까지)';
  el.innerHTML = `<div class="chips">${s.bands.map(b => `<i style="flex:${b.w};background:${b.hex}"></i>`).join('')}</div><b>${s.name}</b> · 띠 ${s.bands.length}개 · ${stage}<small>${Math.max(0, tau).toFixed(0)}초째 · ${snd.on ? '소리 켜짐' : '소리 꺼짐'}</small>`;
}
setInterval(renderState, 500);

/* ───────── 루프 ───────── */
const clock = new THREE.Clock();
let fpsN = 0, fpsT = 0;
function spillOf(s, now) {
  // 지금 벽에 남아 있는 비율(대략)과 띠 평균색
  let k;
  if (s.relAt != null) k = 1 - (now - s.relAt) / Math.max(1, opt.leave + 3 / opt.exitSpd);
  else { const tau = phaseOf(s, now); k = tau < 0 ? 0 : (tau - CF.L0) / Math.max(0.5, opt.travel + Math.max(...s.rank) * opt.gap); }
  const c = new THREE.Color(0, 0, 0); s.bands.forEach(b => c.add(linCol(b.rgb).multiplyScalar(b.w)));
  return c.multiplyScalar(Math.max(0, Math.min(1, k)));
}
function frame(nowMs) {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05), now = nowMs / 1000;
  if (tween) tween(nowMs); else controls.update();
  const cur = field.cur;
  field.idleA = THREE.MathUtils.clamp(field.idleA + (cur ? -dt / 3 : dt / 6), 0, 1);
  // 소리: 띠가 출발할 때
  if (cur) {
    const tau = phaseOf(cur, now);
    if (tau >= 0) cur.bands.forEach((b, i) => { if (tau >= CF.L0 + cur.rank[i] * opt.gap && !cur.launched.has(i)) { cur.launched.add(i); sndLaunch(cur, i); } });
  }
  if (snd.on) {
    const t = snd.ctx.currentTime, br = 0.5 + 0.5 * Math.sin(now * 2 * Math.PI / opt.iBreath);
    snd.idle.gain.setTargetAtTime(field.idleA * 0.05 * (0.6 + 0.4 * br), t, 0.25);
    snd.breath.gain.setTargetAtTime(field.idleA * 0.035 * br * br, t, 0.25);
  }
  SU.uTime.value = now;
  const spill = new THREE.Color(0, 0, 0);
  slots.forEach(sl => {
    const s = sl.show, U = sl.pts.material.uniforms;
    if (!s) return;
    if (s.relAt != null) { U.uRelAge.value = now - s.relAt; if (now - s.relAt > Math.min(CF.XF, opt.leave + 6 + 8 / opt.exitSpd)) { sl.show = null; sl.pts.visible = false; return; } }
    else U.uTau.value = phaseOf(s, now);
    spill.add(spillOf(s, now));
  });
  idlePts.material.uniforms.uIA.value = field.idleA;
  idlePts.visible = field.idleA > 0.003;
  halo.material.opacity = field.idleA * (0.45 + 0.3 * Math.sin(now * 2 * Math.PI / opt.iBreath));
  if (art && field.drop < 1) { field.drop = Math.min(1, field.drop + dt / 1.2); art.position.y = 0.0125 + 0.18 * Math.pow(1 - field.drop, 3); }
  else if (art) art.position.y = 0.0125;
  const sp = spill.clone().multiplyScalar(opt.gain * 0.6).addScalar(0.02 * field.idleA);
  [spillS, spillE].forEach(l => { l.color.copy(sp).multiplyScalar(1 / Math.max(0.001, Math.max(sp.r, sp.g, sp.b))); l.intensity = 22 * Math.max(sp.r, sp.g, sp.b); });

  composer.render();
  const tex = fieldTex();
  if (wallMat.emissiveMap !== tex) { wallMat.emissiveMap = tex; wallMat.needsUpdate = true; }
  if (flatQuad.material.map !== tex) { flatQuad.material.map = tex; flatQuad.material.needsUpdate = true; }

  const { W, H, flatH } = layout;
  renderer.setRenderTarget(null);
  renderer.setScissorTest(true);
  renderer.setScissor(0, 0, W, H); renderer.setViewport(0, 0, W, H); renderer.setClearColor(0x000000); renderer.clear();
  if (opt.mode !== 'flat') { renderer.setScissor(0, flatH, W, H - flatH); renderer.setViewport(0, flatH, W, H - flatH); renderer.render(scene, camera); }
  if (flatH) {
    const y = opt.mode === 'flat' ? (H - flatH) / 2 : 0;
    renderer.setScissor(0, y, W, flatH); renderer.setViewport(0, y, W, flatH); renderer.render(flatScene, flatCam);
  }
  renderer.setScissorTest(false);
  fpsN++; fpsT += dt; if (fpsT > 1) { $('#fps').textContent = `${Math.round(fpsN / fpsT)} fps`; fpsN = 0; fpsT = 0; }
}
fillIdle();
applyDir();
renderUI();
resize();
requestAnimationFrame(frame);
</script>
