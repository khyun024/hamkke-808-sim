<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>색면화 좌대 제작안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 왼쪽 3D 모델(면을 눌러 선택), 오른쪽 선택한 면의 치수·가공. 좁은 화면에서는 위아래로 */
:root {
  --bg: #f3f1ec; --panel: #fbfaf7; --fg: #23211d; --muted: #6f6a61; --line: #dcd7ce; --field: #ffffff;
  --accent: #2f7fd6; --accent-ink: #ffffff; --soft: #e6f0fb;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141412; --panel: #1b1a18; --fg: #ebe7df; --muted: #a39d92; --line: #2f2d29; --field: #23221f; --accent: #6aaef0; --accent-ink: #0b1c2e; --soft: #1d2a38; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #141412; --panel: #1b1a18; --fg: #ebe7df; --muted: #a39d92; --line: #2f2d29; --field: #23221f; --accent: #6aaef0; --accent-ink: #0b1c2e; --soft: #1d2a38; color-scheme: dark; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 13px; overflow: hidden; }
#app { display: grid; grid-template-columns: 1fr 340px; height: 100%; }
main { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
main canvas { display: block; }
.labels { position: absolute; inset: 0; pointer-events: none; }
.lbl { background: rgba(255,255,255,.95); color: #23211d; border-radius: 4px; padding: 2px 6px; font: 500 11px var(--sans); white-space: nowrap; box-shadow: 0 1px 3px rgba(0,0,0,.18); border-left: 3px solid #2f7fd6; }
.lbl.name { border-left-color: #9a948a; font-weight: 700; font-size: 12px; }
.lbl b { font-weight: 700; }
#hud { position: absolute; left: 12px; top: 12px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 24px); }
#hint { position: absolute; left: 12px; bottom: 10px; font: 11px var(--mono); color: var(--muted); }
aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 16px 18px 28px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
h1 { font-size: 17px; margin: 0; }
header p { margin: 4px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
h2 { font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
.b { border: 1px solid var(--line); background: var(--field); color: var(--fg); border-radius: 6px; padding: 5px 9px; font: 500 12px var(--sans); cursor: pointer; }
.b:hover { border-color: var(--accent); }
.b.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.b:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.ped { border: 1px solid var(--line); border-radius: 8px; padding: 10px 11px; background: var(--field); }
.ped .t { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ped .t b { font-size: 13px; }
.ped .t span { font: 500 12px var(--mono); color: var(--muted); }
.ped .faces { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.ped .faces .b { padding: 4px 8px; font-size: 11.5px; }
.ped .faces .b.plain { color: var(--muted); }
#info { border-radius: 8px; background: var(--soft); padding: 11px 12px; }
#info h3 { margin: 0; font-size: 14px; }
#info .size { font: 500 12px var(--mono); margin: 2px 0 8px; }
#info dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; }
#info dt { color: var(--muted); font-size: 12px; white-space: nowrap; }
#info dd { margin: 0; font-size: 12px; line-height: 1.5; }
#info dt.thin { color: #e8893a; font-weight: 700; }
.lbl.thin { border-left-color: #e8893a; }
.fig { margin: 0 0 10px; background: #fff; border-radius: 6px; padding: 6px 4px 4px; }
.fig svg { display: block; width: 100%; height: auto; font: 10px var(--sans); }
.fig figcaption { font-size: 11px; color: #6f6a61; text-align: center; margin-top: 2px; }
#info p { margin: 0; font-size: 12px; line-height: 1.6; color: var(--muted); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; margin-top: 8px; }
.grid label { display: flex; flex-direction: column; gap: 3px; color: var(--muted); font-size: 11.5px; }
.grid input { background: var(--field); color: var(--fg); border: 1px solid var(--line); border-radius: 5px; padding: 5px 7px; font: 12px var(--mono); min-width: 0; }
summary { cursor: pointer; font-size: 12px; color: var(--muted); }
.hint { color: var(--muted); font-size: 11.5px; line-height: 1.6; margin: 0; }
@media (max-width: 820px) {
  #app { grid-template-columns: 1fr; grid-template-rows: 55% 45%; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
}
</style>

<div id="app">
  <main id="main">
    <div id="hud"></div>
    <div id="hint">면을 누르면 치수 · 드래그 회전 · 휠 확대 · 단위 mm</div>
  </main>
  <aside>
    <header>
      <h1>색면화 좌대 제작안</h1>
      <p>좌대 두 개의 크기와 면마다 낼 홈·구멍이에요. 모델이나 아래 버튼에서 면을 누르면 그 면의 치수가 나와요. 왼쪽·오른쪽은 관객이 정면에서 볼 때 기준이에요.</p>
      <p><a href="request/" style="color:var(--accent);font-weight:600">제작 요청서 한 장으로 보기 →</a></p>
    </header>
    <div id="peds"></div>
    <div id="info"></div>
    <div>
      <h2>보기</h2>
      <div style="display:flex;flex-wrap:wrap;gap:6px" id="toggles"></div>
    </div>
    <details>
      <summary>치수 바꿔 보기</summary>
      <div class="grid" id="params"></div>
    </details>
    <p class="hint">안에 넣는 장비(PC·스피커·NFC 리더·USB 팬)는 저희가 설치해요. 좌대는 상자와 홈·구멍까지만 부탁드려요.</p>
  </aside>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const $ = s => document.querySelector(s);
const mm = v => v / 1000;

/* ───────── 치수 (mm) ─────────
   좌표: 정면 −Z(관객), 뒤 +Z, 관객 기준 왼쪽 = +X, 오른쪽 = −X. ① 원점, ② 오른쪽(−X)에 간격 gap */
const FIX = { W: 600, D: 600, H: 900, side: 18, top: 18, topU: 15, plate: 3, frame: 20, hole: 80, notchW: 30, back: 12, stop: 15, lift: 30 }; // lift: 바닥판을 바닥에서 띄우는 높이 (밑으로 선이 들어옴)
const P = { canvas: 242, clear: 2.5, bar: 20, b2H: 600, gap: 300, pc1W: 210, pc1D: 450, pc1H: 490, spkD: 234, spkH: 306, pc2W: 210, pc2D: 450, pc2H: 490 };
const PARAMS = [['canvas', '캔버스 한 변'], ['clear', '구멍 여유 / 한쪽'], ['b2H', '② 높이'], ['gap', '두 좌대 사이']];
const view = { ghost: true, eq: false, lid: false };
let sel = null; // 선택한 면 'A.top' 같은 키

/* ───────── 장면 ───────── */
const main = $('#main');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
main.prepend(renderer.domElement);
const labelR = new CSS2DRenderer(); labelR.domElement.className = 'labels'; main.appendChild(labelR.domElement);
const scene = new THREE.Scene();
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
scene.background = new THREE.Color(dark ? 0x1d1c1a : 0xe9e6df);
const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 50);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.target.set(-0.45, 0.45, 0);
camera.position.set(0.75, 1.65, -2.9);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a857c, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(1.5, 3, -2); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -2, right: 2, top: 2, bottom: -2 }); scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), new THREE.MeshStandardMaterial({ color: dark ? 0x2a2926 : 0xd8d4cb, roughness: 1 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

const canvasTex = new THREE.TextureLoader().load('../colorfield/cf7.jpg'); canvasTex.colorSpace = THREE.SRGBColorSpace;
// 면 재질: 선택한 면은 파랗게 진하게
const faceMat = (key, base = 0xefe9dd, op = 0.28) => {
  const on = key === sel, o = view.ghost ? (on ? 0.7 : op) : 1;
  return new THREE.MeshStandardMaterial({ color: on ? 0x8fc0f2 : base, roughness: .85, transparent: o < 1, opacity: o, depthWrite: o >= 1 });
};
const M = {
  pc: new THREE.MeshStandardMaterial({ color: 0x3a3d42, roughness: .5, metalness: .3 }),
  board: new THREE.MeshStandardMaterial({ color: 0x1f6fb5, roughness: .6 }),
  uno: new THREE.MeshStandardMaterial({ color: 0x0f7f86, roughness: .6 }),
  tag: new THREE.MeshStandardMaterial({ color: 0x31b36b, roughness: .5 }),
  black: new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: .7 }),
  cable: new THREE.MeshStandardMaterial({ color: 0x222222, roughness: .6 }),
  frame: new THREE.MeshStandardMaterial({ color: 0xc9a774, roughness: .8 }),
  metal: new THREE.MeshStandardMaterial({ color: 0x9aa0a6, metalness: .8, roughness: .3 }),
};
let world = null;
const edgeMat = new THREE.LineBasicMaterial({ color: 0x6f6a61, transparent: true, opacity: .55 });
function add(parent, geo, mat, x, y, z, edges = true, face) { // 위치는 mm. face = 누르면 고를 면 키
  const m = new THREE.Mesh(geo, mat); m.position.set(mm(x), mm(y), mm(z)); m.castShadow = m.receiveShadow = true; parent.add(m);
  if (edges) m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 25), edgeMat));
  if (face) m.userData.face = face;
  return m;
}
const box = (parent, w, h, d, x, y, z, mat, edges, face) => add(parent, new THREE.BoxGeometry(mm(w), mm(h), mm(d)), mat, x, y, z, edges, face);
// 평면 모양(XZ, mm)을 아래로 두께만큼 밀어 낸 판. yTop = 윗면 높이
function slab(parent, shape, thick, yTop, mat, face) {
  const g = new THREE.ExtrudeGeometry(shape, { depth: mm(thick), bevelEnabled: false, curveSegments: 24 });
  g.rotateX(Math.PI / 2);
  return add(parent, g, mat, 0, yTop, 0, true, face);
}
const sq = (s, h, path = new THREE.Shape()) => { const a = mm(h); path.moveTo(-a, -a); path.lineTo(a, -a); path.lineTo(a, a); path.lineTo(-a, a); path.closePath(); return path; };
function label(parent, html, x, y, z, cls = '') {
  const el = document.createElement('div'); el.className = 'lbl ' + cls; el.innerHTML = html;
  const o = new CSS2DObject(el); o.position.set(mm(x), mm(y), mm(z)); parent.add(o); return o;
}
function tube(parent, pts, r = 4, mat = M.cable) {
  const c = new THREE.CatmullRomCurve3(pts.map(([x, y, z]) => new THREE.Vector3(mm(x), mm(y), mm(z))));
  parent.add(new THREE.Mesh(new THREE.TubeGeometry(c, 40, mm(r), 8), mat));
}

/* ───────── 좌대 치수·가공 (사이드바와 라벨이 같이 씀) ───────── */
function dims() {
  const pocket = P.canvas + 2 * P.clear, rz = pocket / 2 - P.clear - P.bar / 2; // 리더: 캔버스 한 귀퉁이 아래 (관객 왼쪽·뒤, +X +Z). 어느 귀퉁이든 됨
  const A = { key: 'A', name: '① 색면화 좌대', W: FIX.W, D: FIX.D, H: FIX.H, top: FIX.top, x: 0 };
  const B = { key: 'B', name: '② 추가 좌대', W: FIX.W, D: FIX.D, H: P.b2H, top: FIX.side, x: -(FIX.W + P.gap) };
  [A, B].forEach(S => { S.fl = FIX.lift + FIX.side; S.iw = S.W - 2 * FIX.side; S.ih = S.H - S.top - S.fl; S.hs = S.H - S.top; S.vy = [S.fl + 70, S.hs - 90]; }); // fl = 안쪽 바닥 높이
  const gy = FIX.lift + FIX.side + P.pc1W + P.spkH / 2, gz = FIX.D / 2 - FIX.side - 30 - P.pc1D / 2; // 스피커 자리 (눕힌 PC 위)
  return { pocket, rz, A, B, gy, gz, hz: FIX.D / 2 - FIX.side - 70 };
}
const FACES = [['top', '상판'], ['front', '정면'], ['left', '왼쪽'], ['right', '오른쪽'], ['back', '뒤판'], ['bottom', '바닥']];
// 면 하나의 제작 정보: 크기 + [항목, 내용, 라벨 위치(좌대 기준 mm)]
function spec(key) {
  const d = dims(), [p, f] = key.split('.'), S = d[p], fromBack = z => FIX.D / 2 - z, t = FIX.side;
  const vent = (y) => `200 × 60 · 중심이 바닥에서 ${y}, 뒤 모서리에서 ${fromBack(60)} · 문의: 안의 PC 열을 빼려는 구멍, 낼 수 있는지 (다른 형태도 좋고 어려우면 생략)`;
  const back = [
    ['방식', '뒤 개구부에 쏙 끼워 뒷면과 평평하게. 당겨서 떼고 밀어 넣어 닫음 (경첩·나사 없음)'],
    ['멈춤 각재', `${FIX.stop} × ${FIX.stop}, 개구부 안쪽 네 둘레, 뒤 모서리에서 ${FIX.back} 들어간 자리`, [S.iw / 2 - 40, FIX.side + 40, FIX.D / 2 + 30]],
    ['자석', '멈춤 각재 네 귀퉁이에 4개 (뒤판 쪽엔 철판 와셔)'],
    ['손가락 구멍', 'Ø25, 위쪽 가운데 (위에서 60)', [0, S.hs - 60 + 40, FIX.D / 2 + 30]],
  ];
  const T = {
    'A.top': { size: `600 × 600 × ${FIX.top} (위판 ${FIX.topU} + 받침판 ${FIX.plate})`, fig: topFigs(d), items: [
      ['용도', `색면화 캔버스(4호 S, ${P.canvas} × ${P.canvas}, 틀 높이 ${FIX.frame})를 올려 두는 자리. 캔버스를 올리면 모서리의 NFC 스티커가 읽혀 그 그림의 영상·소리로 바뀌고, 빼면 쉬는 화면으로 돌아감`],
      ['캔버스 구멍', `${d.pocket} × ${d.pocket}, 위판 ${FIX.topU}을 끝까지 뚫음 · 캔버스보다 한쪽 ${P.clear} 크게 (크기 편차·천 두께에도 끼지 않게) · 윗모서리 2 모따기 (내려놓으면 미끄러져 자리 잡게)`, [0, S.H + 55, -d.pocket / 2]],
      ['깊이', `${FIX.topU} (위판 두께 그대로) → 캔버스 틀 ${FIX.frame} 중 ${FIX.topU}가 잠기고 ${FIX.frame - FIX.topU}가 위로 솟음 (집기 쉽게, 그림이 상판 위로 보이게)`],
      ['손잡이 홈', `구멍 왼쪽·오른쪽 변 가운데, 폭 ${FIX.notchW} 반달, 위판까지 뚫음 · 손가락을 넣어 캔버스를 들어 올림`, [d.pocket / 2 + 10, S.H + 25, 0]],
      ['얇게 만들 곳', `<b>받침판 ${FIX.plate}mm</b> 나무판(합판·MDF). 위판 아랫면 전체에 붙여 구멍 바닥이 됨. 리더가 이 판 바로 밑에서 스티커를 읽으므로 두께를 ${FIX.plate}mm로, 많아도 5mm를 넘기지 않음 · 캔버스를 빼도 안이 안 보임 · 구멍으로 보이는 면은 상판과 같은 색`, [-S.W / 2 + 90, S.H - FIX.topU - 10, -S.D / 2 + 40], 'thin'],
      ['리더 자리', `받침판 바로 밑, 구멍 한 귀퉁이 아래 (예: 관객 왼쪽·뒤, 중심에서 왼쪽 ${d.rz}·뒤 ${d.rz}) · NFC 스티커가 캔버스 네 모서리에 있어 어느 귀퉁이든 됨 · 리더는 저희가 붙임 · 태그까지 약 ${FIX.plate + 1}mm`, [d.rz + 30, S.hs - 25, d.rz + 40]],
      ['금속 금지', '받침판·리더 둘레 5cm 안에 나사·타카·철물·금속 도료 없이, 받침판은 목공 본드로만 붙임 (금속이 있으면 태그가 안 읽힘)'],
    ] },
    'B.top': { size: '600 × 600 × 18', items: [['가공', '없음, 측판 위에 고정']] },
    'A.front': { size: `${S.iw} × ${S.hs} × ${t} (양 측판 사이)`, items: [['가공', '없음']] },
    'B.front': { size: `${S.iw} × ${S.hs} × ${t} (양 측판 사이)`, items: [['가공', '없음']] },
    'A.left': { size: `${FIX.D} × ${S.hs} × ${t}`, items: [
      ['배기 구멍', vent(S.vy[1]), [S.W / 2 + 10, S.vy[1] + 45, 60]],
    ] },
    'B.left': { size: `${FIX.D} × ${S.hs} × ${t}`, items: [['배기 구멍', vent(S.vy[1]), [S.W / 2 + 10, S.vy[1] + 45, 60]]] },
    'A.right': { size: `${FIX.D} × ${S.hs} × ${t}`, items: [['흡기 구멍', vent(S.vy[0]), [-S.W / 2 - 10, S.vy[0] + 45, 60]]] },
    'B.right': { size: `${FIX.D} × ${S.hs} × ${t}`, items: [['흡기 구멍', vent(S.vy[0]), [-S.W / 2 - 10, S.vy[0] + 45, 60]]] },
    'A.back': { size: `${S.iw - 2} × ${S.ih - 2} × ${FIX.back} 합판 · 떼는 판`, items: back },
    'B.back': { size: `${S.iw - 2} × ${S.ih - 2} × ${FIX.back} 합판 · 떼는 판`, items: back },
    'A.bottom': { size: `${S.iw} × ${FIX.D - t} × ${t} (측판 사이, 정면판 뒤)`, items: [
      ['높이', `바닥에서 ${FIX.lift} 띄워 붙임. 측판·정면판은 바닥까지 내려와서 앞·옆에서는 안 보임`, [0, S.fl + 20, -FIX.D / 2 + 60]],
      ['선 들어오는 길', `뒤쪽 아래 ${FIX.lift} 틈 → 바닥판 밑 → 선 구멍으로 올라옴`, [0, FIX.lift / 2, FIX.D / 2 + 30]],
      ['선 구멍', `Ø${FIX.hole} · 좌우 가운데, 뒤 모서리에서 ${fromBack(d.hz)} · 브러시 그로밋`, [0, S.fl + 45, d.hz + 30]],
    ] },
  };
  T['B.bottom'] = { ...T['A.bottom'], size: `${S.iw} × ${FIX.D - t} × ${t} (측판 사이, 정면판 뒤)` };
  return { title: S.name + ' · ' + FACES.find(x => x[0] === f)[1] + (f === 'left' || f === 'right' ? ' 측판' : f === 'front' ? '판' : f === 'bottom' ? '판' : ''), ...T[key] };
}

// ① 상판 그림 두 장: 위에서 본 모습(실제 비율), 자른 모습(두께는 과장). 흰 바탕에 회색 판, 얇은 받침판만 주황
function topFigs(d) {
  const pk = d.pocket, ink = '#23211d', mute = '#6f6a61', wood = '#e6dfcf', edge = '#9a948a', thin = '#e8893a';
  const t = (x, y, s, o = '') => `<text x="${x}" y="${y}" ${o}>${s}</text>`;
  // 위에서 본 모습: 600 → 150px. 앞(관객)이 아래, 관객 왼쪽이 그림 왼쪽
  const k = 0.25, cx = 150, cy = 88, X = v => cx + v * k, Y = v => cy + v * k, h = pk / 2, nr = FIX.notchW / 2;
  const hole = `M${X(-h)},${Y(-h)} H${X(h)} V${Y(-nr)} A${nr * k},${nr * k} 0 0 1 ${X(h)},${Y(nr)} V${Y(h)} H${X(-h)} V${Y(nr)} A${nr * k},${nr * k} 0 0 1 ${X(-h)},${Y(-nr)} Z`;
  const rx = X(-d.rz), ry = Y(-d.rz);
  const plan = `<svg viewBox="0 0 300 186" role="img" aria-label="상판을 위에서 본 모습">
    <rect x="${X(-300)}" y="${Y(-300)}" width="150" height="150" fill="${wood}" stroke="${edge}"/>
    <path d="${hole}" fill="${thin}" fill-opacity=".35" stroke="${ink}" stroke-width="1"/>
    <rect x="${rx - 7.5}" y="${ry - 5.6}" width="15" height="11.2" fill="none" stroke="#1f6fb5" stroke-dasharray="2 2"/>
    <line x1="${rx - 8}" y1="${ry}" x2="${X(-300) - 4}" y2="${ry}" stroke="${mute}" stroke-width=".6"/>
    ${t(X(-300) - 6, ry - 3, '리더 자리', `text-anchor="end" fill="${ink}"`)}${t(X(-300) - 6, ry + 9, '(밑, 저희가)', `text-anchor="end" fill="${mute}"`)}
    <line x1="${X(h) + 4}" y1="${Y(0)}" x2="${X(300) + 4}" y2="${Y(0)}" stroke="${mute}" stroke-width=".6"/>
    ${t(X(300) + 6, Y(0) + 3, '손잡이 홈', `fill="${ink}"`)}${t(X(300) + 6, Y(0) + 15, '폭 ' + FIX.notchW, `fill="${mute}"`)}
    ${t(cx, Y(0) - 3, '캔버스 구멍', `text-anchor="middle" fill="${ink}" font-weight="600" font-size="9"`)}${t(cx, Y(0) + 9, pk + ' × ' + pk, `text-anchor="middle" fill="${ink}" font-size="9"`)}
    ${t(cx, Y(-300) - 4, '뒤', `text-anchor="middle" fill="${mute}"`)}${t(cx, Y(300) + 14, '정면 (관객) · 600', `text-anchor="middle" fill="${mute}"`)}
  </svg>`;
  // 자른 모습: 가로 0.45px/mm, 세로 2.2px/mm (두께가 보이게 과장)
  const sx = v => 15 + (v + 300) * 0.45, sy = v => 62 + v * 2.2, cs = P.canvas, bw = P.bar, U = FIX.topU, PL = FIX.plate, fr = FIX.frame;
  const r = (x0, y0, x1, y1, f, o = '') => `<rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" fill="${f}" ${o}/>`;
  const sec = `<svg viewBox="0 0 300 172" role="img" aria-label="상판을 자른 모습">
    <line x1="${sx(-h)}" y1="24" x2="${sx(h)}" y2="24" stroke="${ink}" stroke-width=".7"/>
    <line x1="${sx(-h)}" y1="19" x2="${sx(-h)}" y2="${sy(0)}" stroke="${mute}" stroke-width=".5" stroke-dasharray="2 2"/><line x1="${sx(h)}" y1="19" x2="${sx(h)}" y2="${sy(0)}" stroke="${mute}" stroke-width=".5" stroke-dasharray="2 2"/>
    ${t(150, 18, '캔버스 구멍 ' + pk + ' (캔버스 ' + cs + ' + 한쪽 ' + P.clear + ')', `text-anchor="middle" fill="${ink}" font-weight="600"`)}
    ${r(sx(-300), sy(0), sx(-h), sy(U), wood, `stroke="${edge}"`)}${r(sx(h), sy(0), sx(300), sy(U), wood, `stroke="${edge}"`)}
    ${r(sx(-300), sy(U), sx(300), sy(U + PL), thin, `stroke="${ink}" stroke-width=".6"`)}
    ${r(sx(-300), sy(U + PL), sx(-282), 160, wood, `stroke="${edge}"`)}${r(sx(282), sy(U + PL), sx(300), 160, wood, `stroke="${edge}"`)}
    ${r(sx(-cs / 2), sy(U - fr), sx(-cs / 2 + bw), sy(U), '#c9a774')}${r(sx(cs / 2 - bw), sy(U - fr), sx(cs / 2), sy(U), '#c9a774')}
    ${r(sx(-cs / 2), sy(U - fr) - 2, sx(cs / 2), sy(U - fr) + 1, '#6b8fb5')}
    ${[-1, 1].map(s2 => r(sx(s2 * (cs - bw) / 2 - 12.5), sy(U) - 2, sx(s2 * (cs - bw) / 2 + 12.5), sy(U), '#31b36b')).join('')}
    ${r(sx(d.rz - 30), sy(U + PL) + 1, sx(d.rz + 30), sy(U + PL) + 5, '#1f6fb5')}
    ${t(sx(-300) + 6, sy(U / 2) + 4, '위판 ' + U, `fill="${ink}"`)}
    ${t(sx(-h) + 4, sy(U - fr) - 5, '틀 ' + fr + ' · ' + (fr - U) + ' 솟음', `fill="${ink}"`)}
    ${t(sx(-300) + 6, sy(U + PL) + 14, '받침판 ' + PL + ' · 얇게', `fill="${thin}" font-weight="700"`)}
    ${t(sx(-300) + 6, sy(U + PL) + 26, '목공 본드로만, 금속 X', `fill="${mute}"`)}
    ${t(sx(d.rz), sy(U + PL) + 17, '리더', `text-anchor="middle" fill="#1f6fb5" font-weight="600"`)}
    ${t(sx(d.rz), sy(U + PL) + 29, '스티커까지 약 ' + (PL + 1), `text-anchor="middle" fill="${mute}"`)}
    ${t(sx(0), sy(U) + 0 - 12, 'NFC 스티커 (모서리)', `text-anchor="middle" fill="#2c7a4b"`)}
  </svg>`;
  return `<figure class="fig">${plan}<figcaption>위에서 본 모습</figcaption></figure><figure class="fig">${sec}<figcaption>자른 모습 · 두께는 크게 그림</figcaption></figure>`;
}

/* ───────── 좌대 하나: 측판·정면판·바닥판·떼는 뒤판 + 환기 구멍 ───────── */
const doorT = {}, doors = []; let liftT = 0, lastT = 0;
function body(g, S, d) {
  const { W, D, H, hs, ih, iw, key: k } = S, t = FIX.side;
  box(g, t, hs, D, W / 2 - t / 2, hs / 2, 0, faceMat(k + '.left'), true, k + '.left');      // 왼쪽 측판 +X
  box(g, t, hs, D, -W / 2 + t / 2, hs / 2, 0, faceMat(k + '.right'), true, k + '.right');  // 오른쪽 측판 −X
  box(g, iw, hs, t, 0, hs / 2, -D / 2 + t / 2, faceMat(k + '.front'), true, k + '.front'); // 정면판 −Z
  // 바닥판: 측판 사이·정면판 뒤, 바닥에서 lift만큼 띄움. 뒤쪽 아래 틈으로 선이 들어와 선 구멍으로 올라옴
  const fl = S.fl, bot = new THREE.Shape(); bot.moveTo(mm(-iw / 2), mm(-D / 2 + t)); bot.lineTo(mm(iw / 2), mm(-D / 2 + t)); bot.lineTo(mm(iw / 2), mm(D / 2)); bot.lineTo(mm(-iw / 2), mm(D / 2)); bot.closePath();
  bot.holes.push(new THREE.Path().absarc(0, mm(d.hz), mm(FIX.hole / 2), 0, Math.PI * 2, true));
  slab(g, bot, t, fl, faceMat(k + '.bottom'), k + '.bottom');
  const grom = new THREE.Mesh(new THREE.TorusGeometry(mm(FIX.hole / 2), mm(3), 8, 32), M.black); grom.rotation.x = Math.PI / 2; grom.position.set(0, mm(fl + 1), mm(d.hz)); g.add(grom);
  // 뒤: 개구부 안쪽 둘레에 멈춤 각재, 그 앞에 12mm 뒤판이 쏙 들어가 뒷면과 평평. 자석 4개로 붙음
  const zs = D / 2 - FIX.back - FIX.stop / 2, s = FIX.stop, bm = faceMat(k + '.back', 0xe2dccf, 0.4);
  box(g, iw, s, s, 0, H - S.top - s / 2, zs, bm, true, k + '.back');
  box(g, iw, s, s, 0, fl + s / 2, zs, bm, true, k + '.back');
  [-1, 1].forEach(sx => box(g, s, ih - 2 * s, s, sx * (iw / 2 - s / 2), fl + ih / 2, zs, bm, true, k + '.back'));
  const lid = new THREE.Group(); lid.position.set(0, mm(fl + ih / 2), mm(D / 2 - FIX.back / 2)); g.add(lid);
  box(lid, iw - 2, ih - 2, FIX.back, 0, 0, 0, faceMat(k + '.back', 0xd9d1bf, 0.45), true, k + '.back');
  const fh = new THREE.Mesh(new THREE.CylinderGeometry(mm(12.5), mm(12.5), mm(FIX.back + 1), 24), M.black); fh.rotation.x = Math.PI / 2; fh.position.set(0, mm(ih / 2 - 60), 0); fh.userData.face = k + '.back'; lid.add(fh);
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sy]) => box(lid, 12, 12, 3, sx * (iw / 2 - s / 2), sy * (ih / 2 - s / 2), -FIX.back / 2 - 1.5, M.metal, false, k + '.back'));
  doors.push({ g: lid, key: k, z0: D / 2 - FIX.back / 2 });
  // 환기 구멍: 흡기 오른쪽 아래, 배기 왼쪽 위
  const vent = (x, y, face) => { for (let i = 0; i < 5; i++) box(g, 4, 10, 200, x, y - 30 + 60 * (i + 0.5) / 5, 60, M.black, false, face); };
  vent(-W / 2 - 1, S.vy[0], k + '.right'); vent(W / 2 + 1, S.vy[1], k + '.left');
  label(g, `${S.name} · ${W} × ${D} × ${H}`, 0, H + 130, 0, 'name');
}

// 안에 들어갈 것(보기 토글): PC, 스피커, 리더, 팬, 선
function equipment(A, B, d) {
  const t = FIX.side, S = d.A, pz = d.gz, fl = S.fl;
  box(A, P.pc1H, P.pc1W, P.pc1D, 0, fl + P.pc1W / 2, pz, M.pc, false);                       // ① PC 눕힘
  const sx = Math.min(P.pc1H / 2, S.W / 2 - t - 10) - P.spkD / 2, sr = mm(P.spkD / 2);
  const sp = new THREE.Mesh(new THREE.CylinderGeometry(sr, sr, mm(P.spkH), 40), M.pc); sp.position.set(mm(sx), mm(fl + P.pc1W + P.spkH / 2), mm(pz)); A.add(sp);
  box(A, 56, 1.6, 41, d.rz, S.hs - 1, d.rz, M.board, false);                                   // RC522 (받침판 바로 밑)
  box(A, 68.6, 1.6, 53.4, -90, S.hs - 14, 60, M.uno, false);
  const pb = (G, SS, w, h, dd) => { const z = FIX.D / 2 - t - 30 - dd / 2;
    [[-30, 0], [-10, 1], [10, 2], [30, 3]].forEach(([dx, i]) => tube(G, [[dx, fl + 60 + i * 15, z + dd / 2], [dx * 0.5, fl + 30, d.hz - 10], [dx * 0.3, fl - 8, d.hz], [dx * 0.3, FIX.lift / 2, d.hz + 60], [dx * 0.6, 4, FIX.D / 2 + 400]], i === 0 ? 5 : 3.5));
    box(G, 25, 80, 80, SS.W / 2 - t - 14, SS.vy[1], 60, M.black, false); };                  // USB 팬
  pb(A, S, P.pc1H, P.pc1W, P.pc1D);
  box(B, P.pc2W, P.pc2H, P.pc2D, 0, fl + P.pc2H / 2, FIX.D / 2 - t - 30 - P.pc2D / 2, M.pc, false); // ② PC 세움
  pb(B, d.B, P.pc2W, P.pc2H, P.pc2D);
}

let canvasG = null;
function build() {
  doors.length = 0;
  if (world) { scene.remove(world); world.traverse(o => { if (o.isCSS2DObject) o.element.remove(); o.geometry?.dispose(); }); }
  world = new THREE.Group(); scene.add(world);
  const d = dims(), S = d.A, { frame } = FIX;
  const A = new THREE.Group(); world.add(A); body(A, S, d);
  const B = new THREE.Group(); B.position.x = mm(d.B.x); world.add(B); body(B, d.B, d);
  slab(B, sq(null, d.B.W / 2), d.B.top, d.B.H, faceMat('B.top', 0xe6dfcf, 0.55), 'B.top');

  // ① 상판: 위판(구멍 + 손잡이 반달 홈 관통) + 아래 얇은 받침판. 캔버스는 받침판 위에 앉고 리더는 받침판 바로 밑
  const tm = faceMat('A.top', 0xe6dfcf, 0.55), H = S.H;
  const s2 = sq(null, S.W / 2), h = mm(d.pocket / 2), nr = mm(FIX.notchW / 2), hole = new THREE.Path();
  hole.moveTo(-h, -h); hole.lineTo(h, -h); hole.lineTo(h, -nr); hole.absarc(h, 0, nr, -Math.PI / 2, Math.PI / 2, false); hole.lineTo(h, h); hole.lineTo(-h, h); hole.lineTo(-h, nr); hole.absarc(-h, 0, nr, Math.PI / 2, Math.PI * 1.5, false); hole.closePath();
  s2.holes.push(hole); slab(A, s2, FIX.topU, H, tm, 'A.top');
  const pm = sel === 'A.top' ? new THREE.MeshStandardMaterial({ color: 0xe8893a, roughness: .8 }) : faceMat('A.top', 0xd8cfbd, 0.7); // 얇게 만들 받침판: 상판을 고르면 주황
  slab(A, sq(null, S.W / 2), FIX.plate, H - FIX.topU, pm, 'A.top');
  // 캔버스 (받침판 위에 앉아 위로 5 솟음) + 틀 네 모서리 아랫면 NFC 스티커
  canvasG = new THREE.Group(); A.add(canvasG);
  const cs = P.canvas, bw = P.bar;
  [[0, -(cs - bw) / 2, cs, bw], [0, (cs - bw) / 2, cs, bw], [-(cs - bw) / 2, 0, bw, cs - 2 * bw], [(cs - bw) / 2, 0, bw, cs - 2 * bw]].forEach(([x, z, w, dd]) => box(canvasG, w, frame - 1, dd, x, frame / 2 - 0.5, z, M.frame));
  const face = new THREE.Mesh(new THREE.BoxGeometry(mm(cs), mm(1), mm(cs)), [M.frame, M.frame, new THREE.MeshStandardMaterial({ map: canvasTex, roughness: .9 }), M.frame, M.frame, M.frame]);
  face.position.y = mm(frame - 0.5); face.rotation.y = Math.PI; canvasG.add(face);
  [[1, 1], [-1, 1], [1, -1], [-1, -1]].forEach(([sx, sz]) => { const tg = new THREE.Mesh(new THREE.CylinderGeometry(mm(12.5), mm(12.5), mm(0.6), 24), M.tag); tg.position.set(mm(sx * (cs - bw) / 2), mm(-0.3), mm(sz * (cs - bw) / 2)); canvasG.add(tg); });
  canvasG.userData.y0 = H - FIX.topU;

  if (view.eq) equipment(A, B, d);
  // 선택한 면의 라벨
  if (sel) { const sp = spec(sel), G = sel[0] === 'A' ? A : B; sp.items.forEach(([n, , pos, c]) => pos && label(G, c === 'thin' ? `<b>얇게 ${FIX.plate}mm</b> · 받침판` : '<b>' + n + '</b>', ...pos, c)); }
  renderInfo();
}

/* ───────── 사이드바 ───────── */
function renderPeds() {
  const d = dims();
  $('#peds').innerHTML = [d.A, d.B].map(S => `<div class="ped"><div class="t"><b>${S.name}</b><span>${S.W} × ${S.D} × ${S.H}</span></div>
    <div class="hint">판 ${FIX.side} · 상판 ${S.key === 'A' ? `${FIX.topU}+${FIX.plate} · 캔버스 구멍 · <b style="color:#e8893a">받침판 ${FIX.plate} 얇게</b>` : S.top + ' · 고정'}</div>
    <div class="faces">${FACES.map(([f, n]) => { const k = S.key + '.' + f, plain = spec(k).items[0][1].startsWith('없음'); return `<button class="b${plain ? ' plain' : ''}${sel === k ? ' on' : ''}" data-k="${k}">${n}</button>`; }).join('')}</div></div>`).join('');
  $('#peds').querySelectorAll('button').forEach(b => b.onclick = () => select(b.dataset.k, true));
}
function renderInfo() {
  renderPeds();
  if (!sel) { $('#info').innerHTML = `<p>면을 고르세요. 회색 버튼은 가공이 없는 면이에요.</p>`; return; }
  const sp = spec(sel);
  $('#info').innerHTML = `<h3>${sp.title}</h3><div class="size">${sp.size}</div>${sp.fig || ''}<dl>${sp.items.map(([n, v, , c]) => `<dt class="${c || ''}">${n}</dt><dd>${v}</dd>`).join('')}</dl>`;
}

/* ───────── 선택 · 카메라 ───────── */
let tween = null;
function flyTo(p, t) { const p0 = camera.position.clone(), t0 = controls.target.clone(), st = performance.now(), P1 = new THREE.Vector3(...p), T1 = new THREE.Vector3(...t); tween = now => { const k = Math.min(1, (now - st) / 700), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; camera.position.lerpVectors(p0, P1, e); controls.target.lerpVectors(t0, T1, e); if (k >= 1) tween = null; }; }
function faceView(k) {
  const d = dims(), [p, f] = k.split('.'), S = d[p], cx = mm(S.x), H = mm(S.H), my = H * 0.55;
  return {
    top: [[cx + 0.35, H + 1.2, -0.95], [cx, H, 0]],
    front: [[cx + 0.5, my + 0.4, -2.5], [cx, H / 2, 0]],
    left: p === 'B' ? [[cx + 0.3, H + 1.2, -1.7], [cx + 0.3, H / 2, 0]] : [[cx + 2.5, my + 0.4, -0.6], [cx, H / 2, 0]],
    right: [[cx - 2.5, my + 0.4, -0.6], [cx, H / 2, 0]],
    back: [[cx + 0.6, my + 0.45, 2.6], [cx, H / 2, 0.1]],
    bottom: [[cx + 0.5, H + 1.2, 1.3], [cx, 0.05, 0.1]],
  }[f];
}
function select(k, fly) {
  sel = sel === k ? null : k;
  if (sel && fly) flyTo(...faceView(sel));
  build();
}
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
function pick(e) {
  const r = renderer.domElement.getBoundingClientRect(); ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObject(world, true).find(i => i.object.isMesh && i.object.userData.face);
  return hit?.object.userData.face ?? null;
}
let down = null;
renderer.domElement.addEventListener('pointerdown', e => down = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => { if (down && Math.hypot(e.clientX - down[0], e.clientY - down[1]) < 5) { const k = pick(e); if (k || sel) select(k ?? sel, false); } down = null; });
renderer.domElement.addEventListener('pointermove', e => { if (!e.buttons) renderer.domElement.style.cursor = pick(e) ? 'pointer' : ''; });

/* ───────── UI ───────── */
[['전체', [0.75, 1.65, -2.9], [-0.45, 0.45, 0]], ['위에서', [0.2, 2.2, -0.9], [-0.3, 0.6, 0]], ['뒤에서', [0.3, 1.3, 2.9], [-0.45, 0.4, 0.3]]]
  .forEach(([n, p, t]) => { const b = document.createElement('button'); b.className = 'b'; b.textContent = n; b.onclick = () => flyTo(p, t); $('#hud').appendChild(b); });
[['ghost', '반투명'], ['lid', '뒤판 떼기'], ['eq', '안에 들어갈 것']].forEach(([k, n]) => {
  const b = document.createElement('button'); b.className = 'b' + (view[k] ? ' on' : ''); b.textContent = n;
  b.onclick = () => { view[k] = !view[k]; b.classList.toggle('on', view[k]); if (k !== 'lid') build(); }; // 뒤판은 루프에서 움직임
  $('#toggles').appendChild(b);
});
PARAMS.forEach(([k, l]) => {
  const lab = document.createElement('label'); lab.innerHTML = `${l}<input type="number" step="${k === 'clear' ? 0.5 : 1}" value="${P[k]}">`;
  lab.querySelector('input').onchange = e => { const v = +e.target.value; if (v > 0) { P[k] = v; build(); } };
  $('#params').appendChild(lab);
});

function resize() { const w = main.clientWidth, h = main.clientHeight; renderer.setSize(w, h); labelR.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(main);
build(); resize();
// 뒤판: 뒤로 당겨 빼고 살짝 내려놓음 / 캔버스: 상판을 고르면 들어 올림. 둘 다 약 1초 사인 가감속
const ease = v => (1 - Math.cos(Math.PI * v)) / 2, toward = (v, to, dt) => to > v ? Math.min(to, v + dt) : Math.max(to, v - dt);
function animate(now) {
  const dt = Math.min(0.05, (now - (lastT || now)) / 1000); lastT = now;
  doors.forEach(o => {
    const v = doorT[o.key] = toward(doorT[o.key] || 0, view.lid || sel === o.key + '.back' ? 1 : 0, dt), e = ease(v);
    o.g.position.z = mm(o.z0 + 260 * e); o.g.rotation.x = 0.12 * Math.max(0, e - 0.6) / 0.4;
  });
  liftT = toward(liftT, sel === 'A.top' ? 1 : 0, dt);
  if (canvasG) canvasG.position.y = mm(canvasG.userData.y0 + 160 * ease(liftT));
}
renderer.setAnimationLoop(now => { if (tween) tween(now); animate(now); controls.update(); renderer.render(scene, camera); labelR.render(scene, camera); });
